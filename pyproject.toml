[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "propmeasure"
version = "2.0.0"
description = "Lawn, bed, paving and roof measurements from satellite imagery with a fine-tuned segmentation model"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Kurinets" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-image>=0.23",
    "pillow>=10.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
propmeasure = "propmeasure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propmeasure = ["schema.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependencies are declared as argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
